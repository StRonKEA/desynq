<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
  </style>
</helmet>

<div style="width: 1000px; height: 660px; box-sizing: border-box; background: #0e1114; color: #eaeef0; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; padding: 0 26px; height: 50px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4ec98a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h4l3-7 4 14 3-7h6"></path>
      </svg>
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">dpi</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d8a91" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 8.6a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V10a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"></path>
      </svg>
    </div>
  </div>

  <!-- the hero answers the only question, once, for the whole machine -->
  <div style="padding: 26px 26px 30px; display: flex; align-items: center; gap: 26px; flex-shrink: 0;">
    <div style="width: 62px; height: 62px; border-radius: 50%; border: 2px solid #e5675f; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#e5675f" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 8v5M12 16.5v.5"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 7px; min-width: 0;">
      <div style="font-size: 25px; font-weight: 600; letter-spacing: -0.02em;">discord.com is blocked</div>
      <div style="font-size: 14px; color: #96a3aa;">Your provider answers with a block page. One fix, and it only touches this site.</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="padding: 12px 22px; border-radius: 8px; background: #2f6f52; font-size: 14.5px; font-weight: 600; color: #f2fbf6; flex-shrink: 0;">
      Fix it
    </div>
  </div>

  <!-- tabs: the depth is here, but only if you go looking for it -->
  <div style="padding: 0 26px; display: flex; gap: 26px; border-bottom: 1px solid #1d2429; flex-shrink: 0;">
    <div style="padding: 0 2px 11px; font-size: 14px; font-weight: 600; color: #eaeef0; box-shadow: inset 0 -2px 0 #4ec98a;">Sites</div>
    <div style="padding: 0 2px 11px; font-size: 14px; color: #7d8a91;">Measurements</div>
    <div style="padding: 0 2px 11px; font-size: 14px; color: #7d8a91;">Activity</div>
  </div>

  <div style="padding: 8px 26px 0; flex-grow: 1; min-height: 0; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 15px; padding: 15px 4px; border-bottom: 1px solid #171c20;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #e5675f; flex-shrink: 0;"></span>
      <span style="font-size: 14.5px; font-weight: 600; width: 150px;">discord.com</span>
      <span style="font-size: 13.5px; color: #96a3aa;">wrong address</span>
      <div style="flex-grow: 1;"></div>
      <span style="font-size: 13px; color: #6f8fb8;">Fix</span>
      <span style="font-size: 15px; color: #7d8a91;">&times;</span>
    </div>

    <div style="display: flex; align-items: center; gap: 15px; padding: 15px 4px; border-bottom: 1px solid #171c20;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #4ec98a; flex-shrink: 0;"></span>
      <span style="font-size: 14.5px; font-weight: 600; width: 150px; color: #c3cdd2;">github.com</span>
      <span style="font-size: 13.5px; color: #7d8a91;">opens normally</span>
      <div style="flex-grow: 1;"></div>
      <span style="font-size: 15px; color: #7d8a91;">&times;</span>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; padding: 15px 4px; color: #7d8a91;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7d8a91" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      <span style="font-size: 13.5px;">Add a site</span>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="padding: 0 4px 20px; display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 12.5px; color: #7d8a91;">Nothing installed, so no traffic is being touched</span>
      <span style="font-size: 12.5px; color: #7d8a91;">&middot;</span>
      <span style="font-size: 12.5px; color: #6f8fb8;">Check again</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
